<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="도파민 메뉴">
<meta name="theme-color" content="#FAFAFA">
<title>작은 도파민 메뉴</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', system-ui, sans-serif;
    background: #FAFAFA; color: #2D2D2D; min-height: 100dvh;
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 32px 20px 48px; }
  .header { text-align: center; margin-bottom: 28px; }
  .header small { font-size: 13px; letter-spacing: 0.08em; color: #888; }
  .header h1 { font-size: 26px; font-weight: 700; margin: 6px 0 0; line-height: 1.3; }
  .header p { font-size: 14px; color: #777; margin-top: 8px; }

  .progress { text-align: center; font-size: 13px; color: #999; margin-bottom: 20px; }
  .progress .count { font-weight: 700; color: #4A7C59; }

  .random-btn {
    display: block; width: 100%; padding: 14px 20px;
    font-size: 16px; font-weight: 600; color: #fff;
    background: linear-gradient(135deg, #4A7C59, #2E6B8A);
    border: none; border-radius: 14px; cursor: pointer;
    transition: opacity 0.15s; letter-spacing: 0.02em;
  }
  .random-btn:active { opacity: 0.85; }
  .random-btn.spinning { background: linear-gradient(135deg, #999, #aaa); cursor: wait; }
  .random-btn:disabled { background: linear-gradient(135deg, #ccc, #bbb); cursor: default; }

  .picked {
    margin: 12px 0 20px; padding: 16px 20px;
    border-radius: 10px; border-left: 4px solid; animation: fadeIn 0.3s ease;
  }
  .picked .cat-label { font-size: 12px; font-weight: 600; }
  .picked .pick-text { font-size: 17px; font-weight: 600; margin-top: 6px; }
  .picked-actions { display: flex; gap: 8px; margin-top: 12px; }
  .done-btn {
    flex: 1; padding: 10px 16px; font-size: 14px; font-weight: 600;
    color: #fff; background: #4A7C59; border: none; border-radius: 10px;
    cursor: pointer; transition: opacity 0.15s;
  }
  .done-btn:active { opacity: 0.85; }
  .skip-btn {
    padding: 10px 16px; font-size: 14px; font-weight: 600;
    color: #888; background: #F0F0F0; border: none; border-radius: 10px;
    cursor: pointer; transition: opacity 0.15s;
  }
  .skip-btn:active { opacity: 0.85; }

  .all-done {
    margin: 12px 0 20px; padding: 20px; border-radius: 10px;
    background: #EEF5F0; text-align: center; animation: fadeIn 0.3s ease;
  }
  .all-done .emoji { font-size: 32px; margin-bottom: 8px; }
  .all-done .msg { font-size: 15px; font-weight: 600; color: #4A7C59; }
  .all-done .sub { font-size: 13px; color: #888; margin-top: 4px; }

  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 20px 0 16px; }
  .tab {
    padding: 6px 14px; font-size: 13px; font-weight: 500;
    border: none; border-radius: 20px; cursor: pointer;
    transition: all 0.15s; background: #F0F0F0; color: #555;
  }
  .tab.active { font-weight: 700; }

  .category { margin-bottom: 20px; }
  .cat-title {
    font-size: 15px; font-weight: 700; margin: 0 0 10px 2px;
    display: flex; align-items: center; gap: 6px;
  }
  .cat-title .count { font-size: 12px; font-weight: 500; color: #aaa; }
  .items { display: flex; flex-wrap: wrap; gap: 8px; }
  .item {
    padding: 8px 14px; font-size: 14px; line-height: 1.4;
    border-radius: 10px; cursor: pointer; transition: all 0.15s; user-select: none;
  }
  .item:active { transform: scale(0.97); }
  .item.done { opacity: 0.4; text-decoration: line-through; }
  .item.done::before { content: "✓ "; font-weight: 700; }

  .reset-row { text-align: center; margin-top: 24px; }
  .reset-btn {
    font-size: 13px; color: #bbb; background: none;
    border: 1px solid #e0e0e0; border-radius: 20px;
    padding: 6px 16px; cursor: pointer; transition: all 0.15s;
  }
  .reset-btn:active { color: #888; border-color: #ccc; }

  .footer { text-align: center; font-size: 12px; color: #bbb; margin-top: 32px; line-height: 1.5; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <small>딴짓 대신</small>
    <h1>작은 도파민 메뉴 🎲</h1>
    <p>5분이면 충분해. 하나만 골라봐!</p>
  </div>
  <div class="progress" id="progress"></div>
  <button class="random-btn" id="randomBtn" onclick="pickRandom()">🎲 랜덤으로 하나 뽑기</button>
  <div id="pickedArea"></div>
  <div class="tabs" id="tabs"></div>
  <div id="lists"></div>
  <div class="reset-row" id="resetRow" style="display:none">
    <button class="reset-btn" onclick="resetAll()">오늘 기록 초기화</button>
  </div>
  <p class="footer">폰 들기 전에 여기서 하나만 먼저 ✊</p>
</div>
<script>
const CATEGORIES = [
  { id:"health", label:"Health", emoji:"🦴", color:"#4A7C59", bg:"#EEF5F0",
    items:["5분 산책","물 한 컵 마시기","폼롤러","L자 다리","5분 호흡","다리 마사지","발 마사지","스트레칭 5분"]},
  { id:"beauty", label:"Beauty", emoji:"✨", color:"#8B6F8E", bg:"#F3EEF4",
    items:["얼굴 괄사","핸드크림 + 손 마사지","두피 마사지","팩","페이스 요가 3분", "머리 빗고 헤어 케어"]},
  { id:"english", label:"영어", emoji:"📖", color:"#B8860B", bg:"#F7F3E8",
    items:["원서 5분 읽기", "원서 2쪽 소리내 읽기", "원서 필사 1문장 이상","딕테이션 + 쉐도잉 1문장 이상","영어 뉴스 헤드라인 3개 읽기","랜덤 단어 학습+예문 읽기", "뉴욕타임즈 영어 게임", "영어 혼잣말 및 쓰기 3문장", "영어 팟캐스트 듣기", "AI와 영어로 5분 수다"]},
  { id:"dev", label:"개발", emoji:"💻", color:"#2E6B8A", bg:"#ECF3F7",
    items:["오늘의 깃헙 트렌드 읽기", "최근 PR/코드 리뷰 돌아보기", "라이브러리 코드 1개 뜯어보기", "CS 워크북 문제 1개 풀이", "테크 스택 관련 질문 하나 답해보기", "최근 작업을 면접 답변처럼 30초 설명", "CS 관련 지식 콘텐츠 하나 보기", "코테 문제 1개 풀기", "CS 개념 1개 복습"]},
  { id:"etc", label:"기타", emoji:"🌿", color:"#6B7B6E", bg:"#F0F2F0",
    items:["듀오링고", "스페인어 강의", "블로그 글 조금 써보기", "책상 주변 정리","티 타임","식물 물주거나 청소기 돌리기","브라우저 탭 닫기", "파일/북마크/사진 10개 지우거나 정리", "책 5쪽 읽기", "음악 한 곡 듣기 (폰 엎어놓고)","내일 입을 옷 꺼내놓기","가계부 쓰기", "동기부여 컨텐츠 보기", "5분 브레인 덤핑", "아무거나 5분 정리"]}
];

const allItems = CATEGORIES.flatMap(c => c.items.map(t => ({text:t, cat:c})));
let activeTab = null;

function getDoneToday() {
  try {
    const data = JSON.parse(localStorage.getItem('doneToday') || '{}');
    if (data.date !== new Date().toDateString()) return [];
    return data.items || [];
  } catch { return []; }
}
function saveDone(items) {
  localStorage.setItem('doneToday', JSON.stringify({ date: new Date().toDateString(), items }));
}
function markDone(itemText) {
  const done = getDoneToday();
  if (!done.includes(itemText)) { done.push(itemText); saveDone(done); }
  document.getElementById('pickedArea').innerHTML = '';
  renderAll();
}
function toggleDone(itemText) {
  const done = getDoneToday();
  const idx = done.indexOf(itemText);
  if (idx >= 0) done.splice(idx, 1); else done.push(itemText);
  saveDone(done);
  renderAll();
}
function resetAll() {
  localStorage.removeItem('doneToday');
  document.getElementById('pickedArea').innerHTML = '';
  renderAll();
}
function getAvailable() {
  const done = getDoneToday();
  return allItems.filter(i => !done.includes(i.text));
}

function esc(s) { return s.replace(/'/g, "\\'"); }

function renderProgress() {
  const done = getDoneToday();
  const el = document.getElementById('progress');
  const resetRow = document.getElementById('resetRow');
  if (done.length === 0) { el.innerHTML = ''; resetRow.style.display = 'none'; }
  else { el.innerHTML = '오늘 <span class="count">' + done.length + '</span>개 완료 🔥'; resetRow.style.display = 'block'; }
}

function pickRandom() {
  const available = getAvailable();
  if (available.length === 0) {
    document.getElementById('pickedArea').innerHTML =
      '<div class="all-done"><div class="emoji">🎉</div><div class="msg">오늘 전부 다 했어!</div><div class="sub">대단하다 진짜. 이제 좀 쉬어도 돼.</div></div>';
    return;
  }
  const btn = document.getElementById('randomBtn');
  const area = document.getElementById('pickedArea');
  btn.classList.add('spinning'); btn.textContent = '고르는 중...'; btn.disabled = true;
  area.innerHTML = '';
  let count = 0;
  const interval = setInterval(() => {
    const r = available[Math.floor(Math.random() * available.length)];
    const showActions = count > 12;
    area.innerHTML =
      '<div class="picked" style="background:' + r.cat.bg + ';border-color:' + r.cat.color + '">' +
        '<div class="cat-label" style="color:' + r.cat.color + '">' + r.cat.emoji + ' ' + r.cat.label + '</div>' +
        '<div class="pick-text">' + r.text + '</div>' +
        (showActions ? '<div class="picked-actions"><button class="done-btn" onclick="markDone(\'' + esc(r.text) + '\')">✅ 했어!</button><button class="skip-btn" onclick="pickRandom()">🔄 다시</button></div>' : '') +
      '</div>';
    count++;
    if (count > 12) {
      clearInterval(interval);
      btn.classList.remove('spinning'); btn.textContent = '🎲 다시 뽑기'; btn.disabled = false;
    }
  }, 100);
}

function renderTabs() {
  const el = document.getElementById('tabs');
  let html = '<button class="tab ' + (activeTab===null?'active':'') + '" style="' + (activeTab===null?'background:#2D2D2D;color:#fff;font-weight:700':'') + '" onclick="setTab(null)">전체</button>';
  CATEGORIES.forEach(c => {
    const on = activeTab === c.id;
    html += '<button class="tab ' + (on?'active':'') + '" style="background:' + (on?c.color:c.bg) + ';color:' + (on?'#fff':c.color) + ';' + (on?'font-weight:700':'') + '" onclick="setTab(\'' + c.id + '\')">' + c.emoji + ' ' + c.label + '</button>';
  });
  el.innerHTML = html;
}

function renderLists() {
  const el = document.getElementById('lists');
  const cats = activeTab ? CATEGORIES.filter(c => c.id === activeTab) : CATEGORIES;
  const done = getDoneToday();
  el.innerHTML = cats.map(c => {
    const doneCount = c.items.filter(i => done.includes(i)).length;
    return '<div class="category"><div class="cat-title" style="color:' + c.color + '">' +
      c.emoji + ' ' + c.label + ' <span class="count">' + doneCount + '/' + c.items.length + '</span></div>' +
      '<div class="items">' +
      c.items.map(item => {
        const isDone = done.includes(item);
        return '<div class="item ' + (isDone?'done':'') + '" style="background:' + c.bg + '" onclick="toggleDone(\'' + esc(item) + '\')">' + item + '</div>';
      }).join('') +
      '</div></div>';
  }).join('');
}

function setTab(id) { activeTab = activeTab === id ? null : id; renderAll(); }
function renderAll() { renderProgress(); renderTabs(); renderLists(); }
renderAll();
</script>
</body>
</html>
